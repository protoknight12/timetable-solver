<!doctype html>
<html lang="bg" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} · SATurn</title>

  <script>
  
    (() => {
      let theme = null;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-bs-theme", theme);
    })();
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{{ url_for('pages.index') }}">
      <i class="bi bi-calendar3"></i> SATurn
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Отвори менюто">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'pages.index' %}active{% endif %}"
             {% if request.endpoint == 'pages.index' %}aria-current="page"{% endif %}
             href="{{ url_for('pages.index') }}">Начало</a>
        </li>
       
        <li class="nav-item"><span class="nav-link disabled">Разписание</span></li>
      </ul>

      <ul class="navbar-nav align-items-lg-center gap-2">
        <li class="nav-item">
          <button id="theme-toggle" type="button" class="btn btn-outline-secondary btn-sm"
                  aria-label="Смяна на темата" title="Смяна на темата">
            <i class="bi bi-moon-stars" id="theme-icon"></i>
            <span id="theme-label">Тъмна тема</span>
          </button>
        </li>
       <li class="nav-item">
          <a class="btn btn-primary btn-sm px-3"
             {% if request.endpoint == 'pages.login' %}aria-current="page"{% endif %}
              href="{{ url_for('pages.login') }}">Вход</a>
          </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-4 flex-grow-1">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category if category != 'message' else 'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Затвори"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</body>
</html>
