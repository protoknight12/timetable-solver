{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">{{ heading }}</h1>

        <form method="post">
          {{ form.hidden_tag() }}
          {% if form.problem %}<div class="alert alert-danger" role="alert">{{ form.problem }}</div>{% endif %}
          {% include 'constraints/_fields.html' %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Запази</button>
            <a class="btn btn-outline-secondary" href="{{ cancel_url }}">Отказ</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
